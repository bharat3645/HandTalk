name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client-build:
    name: Client build (CRA, CI=true)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # CI=true makes react-scripts treat ESLint warnings as build-failing
      # errors -- this is what originally caught the unused-var/missing-dep/
      # missing-switch-default bugs fixed earlier in this project's history.
      - run: CI=true npm run build

  signaling-server-install:
    name: Signaling server install (Node/Express/Socket.IO)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Boot it briefly and confirm /health responds, instead of only
      # checking that `npm ci` succeeded.
      - run: |
          node index.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              echo "signaling server is healthy"
              kill $SERVER_PID
              exit 0
            fi
            sleep 0.5
          done
          echo "signaling server never became healthy" >&2
          kill $SERVER_PID
          exit 1

  python-backends:
    name: Python ML backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Exercises the exact two regression classes that previously took this
      # project's three Python backends down: best_model.keras failing to
      # deserialize under a newer Keras release, and mediapipe removing the
      # `mp.solutions.hands` API. See tests/test_asl_model.py for details.
      - run: pytest tests/ -v

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: client
          push: false
      - name: Build signaling server image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile.node
          push: false
      - name: Build Python ML backend image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile.python
          push: false
